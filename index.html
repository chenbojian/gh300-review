<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GH-300 复习索引</title><style>
*{box-sizing:border-box}body{font:15px/1.5 system-ui,-apple-system,sans-serif;max-width:900px;margin:0 auto;padding:32px 18px;background:#f4f6fa;color:#202f42}h1{font-size:26px;margin:0 0 4px}p{margin:7px 0;color:#5a6a7d}a{color:#245ca4}a:hover{text-decoration:underline}.summary{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.pill{background:#fff;border:1px solid #dde4ee;border-radius:10px;padding:8px 13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0;align-items:center}button{font:inherit;border:1px solid #d9e1ed;background:#fff;color:#405269;padding:8px 13px;border-radius:9px;cursor:pointer}button:hover{background:#f0f5fb}button.active{background:#245ca4;border-color:#245ca4;color:#fff}.clear{margin-left:auto;color:#ad3b42}.list{padding:0;list-style:none}.item{display:flex;align-items:center;gap:8px;background:#fff;margin:8px 0;padding:12px 14px;border:1px solid #e5ebf2;border-radius:10px}.item a{flex:1;min-width:0;font-weight:600;text-decoration:none}.item .done{color:#357858}.item .wrong{color:#bb4a39}.item button{font-size:13px;padding:7px 10px;white-space:nowrap}.item button[aria-pressed=true].done{background:#eaf7ef;border-color:#b4ddc2}.item button[aria-pressed=true].wrong{background:#fff0ed;border-color:#efc2ba}.empty{padding:24px;text-align:center;color:#78889b}.notice{font-size:13px} @media(max-width:520px){body{padding:20px 12px}h1{font-size:22px}.item{padding:10px;gap:5px}.item button{padding:7px}.clear{margin-left:0}}
</style></head><body><h1>GH-300 复习索引</h1><p id="description"></p><p><a href="https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/gh-300" target="_blank" rel="noopener">官方考试大纲</a> · <a href="https://www.examtopics.com/exams/microsoft/gh-300/view/" target="_blank" rel="noopener">ExamTopics 题库入口</a></p><p class="notice">点击题目自动标记已复习；错题可单独标记。记录只保存在当前浏览器，不会跨设备同步。</p><div class="summary"><span class="pill" id="total"></span><span class="pill" id="reviewed"></span><span class="pill" id="wrongCount"></span></div><div class="toolbar" aria-label="筛选"><button data-filter="all" class="active" aria-pressed="true">全部</button><button data-filter="unread" aria-pressed="false">未复习</button><button data-filter="reviewed" aria-pressed="false">已复习</button><button data-filter="wrong" aria-pressed="false">错题</button><button class="clear" id="clear">清空全部记录</button></div><ul class="list" id="items"></ul><script>
const items=[[1, 1, 311769], [1, 2, 313312], [1, 3, 313138], [1, 4, 312747], [1, 5, 401995], [1, 6, 401996], [1, 7, 401997], [1, 8, 401998], [1, 9, 401999], [1, 10, 402000], [1, 11, 402001], [1, 12, 402002], [2, 1, 311394], [2, 2, 311573], [2, 3, 312749], [2, 4, 313139], [2, 5, 314060], [2, 6, 314080], [2, 7, 314111], [2, 8, 314082], [2, 9, 313532], [2, 10, 314110], [2, 11, 314075], [2, 12, 314089], [2, 13, 314109], [2, 14, 314074], [2, 15, 314094], [2, 16, 314090], [2, 17, 314067], [2, 18, 314064], [2, 19, 311904], [2, 20, 314081], [2, 21, 402003], [2, 22, 402004], [2, 25, 402007], [2, 26, 402008], [2, 28, 402010], [2, 29, 402011], [2, 31, 402013], [2, 33, 402015], [2, 34, 402016], [2, 35, 402017], [3, 1, 314076], [3, 2, 314086], [3, 3, 314068], [3, 4, 314087], [3, 5, 314088], [3, 6, 314078], [3, 7, 314099], [3, 8, 314073], [3, 9, 314062], [3, 10, 314105], [3, 11, 314079], [3, 12, 314085], [3, 13, 314106], [3, 14, 314098], [3, 15, 402018], [3, 16, 402019], [3, 17, 402020], [4, 1, 314102], [4, 2, 314061], [4, 3, 314097], [4, 4, 314107], [4, 5, 314063], [4, 6, 402021], [4, 7, 402022], [4, 8, 402023], [5, 1, 314069], [5, 2, 314065], [5, 3, 314104], [5, 4, 314072], [5, 5, 314083], [5, 6, 314071], [5, 7, 314101], [5, 8, 314092], [5, 9, 314066], [5, 10, 314096], [5, 11, 402024], [5, 12, 402025], [5, 13, 402026], [5, 14, 402027], [5, 15, 402028], [5, 16, 402029], [5, 17, 402030], [6, 1, 314070], [6, 2, 314084], [6, 3, 314100], [6, 4, 314091], [6, 5, 311804], [6, 6, 402031], [6, 7, 402032], [6, 8, 402033], [7, 1, 314113], [7, 2, 314112], [7, 3, 314103], [7, 4, 314093], [7, 5, 314108], [7, 6, 314077], [7, 7, 314095], [7, 8, 402036], [7, 9, 402037], [7, 10, 402038], [7, 12, 402040]];
let filter='all';const ul=document.querySelector('#items');const readKey=id=>`gh300-${id}`;const wrongKey=id=>`gh300-wrong-${id}`;const isRead=id=>localStorage.getItem(readKey(id))==='1';const isWrong=id=>localStorage.getItem(wrongKey(id))==='1';
document.querySelector('#description').textContent=`公开讨论链接 · 已找到 ${items.length} 个，已扫描 1550/1550 页。`;
function render(){let nRead=0,nWrong=0;ul.replaceChildren();for(const [topic,q,id] of items){const reviewed=isRead(id),wrong=isWrong(id);nRead+=reviewed;nWrong+=wrong;if(filter==='unread'&&reviewed||filter==='reviewed'&&!reviewed||filter==='wrong'&&!wrong)continue;const li=document.createElement('li');li.className='item';const a=document.createElement('a');a.href=`https://www.examtopics.com/discussions/microsoft/view/${id}-exam-gh-300-topic-${topic}-question-${q}-discussion/`;a.textContent=`Topic ${topic} · 第 ${q} 题`;a.target='_blank';a.rel='noopener';a.addEventListener('click',()=>{localStorage.setItem(readKey(id),'1');render()});const done=document.createElement('button');done.type='button';done.className='done';done.textContent=reviewed?'✓ 已复习':'未复习';done.setAttribute('aria-pressed',String(reviewed));done.addEventListener('click',()=>{reviewed?localStorage.removeItem(readKey(id)):localStorage.setItem(readKey(id),'1');render()});const w=document.createElement('button');w.type='button';w.className='wrong';w.textContent=wrong?'★ 错题':'☆ 标错';w.setAttribute('aria-pressed',String(wrong));w.addEventListener('click',()=>{wrong?localStorage.removeItem(wrongKey(id)):localStorage.setItem(wrongKey(id),'1');render()});li.append(a,done,w);ul.append(li)}document.querySelector('#total').textContent=`共 ${items.length} 题`;document.querySelector('#reviewed').textContent=`已复习 ${nRead} 题`;document.querySelector('#wrongCount').textContent=`错题 ${nWrong} 题`;if(!ul.children.length){const li=document.createElement('li');li.className='empty';li.textContent='没有符合条件的题目';ul.append(li)}}
for(const button of document.querySelectorAll('[data-filter]'))button.addEventListener('click',()=>{filter=button.dataset.filter;for(const b of document.querySelectorAll('[data-filter]')){const active=b===button;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))}render()});document.querySelector('#clear').addEventListener('click',()=>{if(!confirm('确定清空本浏览器中所有 GH-300 的复习和错题记录吗？'))return;for(const [, , id] of items){localStorage.removeItem(readKey(id));localStorage.removeItem(wrongKey(id))}render()});render();
</script></body></html>
